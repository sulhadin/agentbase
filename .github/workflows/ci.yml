name: ci
on: [pull_request, push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: the example content init ships is well-formed
        run: node scripts/lint-groups.mjs templates/content
      - run: npm test
      # What `npm publish` would ship; fails if a file the CLI needs is left out of "files".
      - run: npm pack --dry-run --json | node scripts/check-pack.mjs
