# The squash commit takes the PR title, and the release workflow versions from those commits.
name: pr title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - env: { TITLE: "${{ github.event.pull_request.title }}" }
        run: |
          re='^(feat|fix|perf|revert|refactor|docs|chore|ci|build|test|style)(\([^)]+\))?!?: .+'
          [[ "$TITLE" =~ $re ]] || {
            echo "::error::PR title must be a conventional commit, e.g. 'feat(skills): add api-design'"
            exit 1
          }
