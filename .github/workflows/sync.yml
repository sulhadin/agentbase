# Opens (or updates) a PR in every repo tagged with the `agentbase-consumer` topic,
# bumping its agentbase ref and regenerating tool config.
name: sync consumers
on:
  workflow_call:
    inputs:
      ref: { type: string, required: true }
  workflow_dispatch:
    inputs:
      ref: { description: "agentbase tag to roll out (e.g. v1.4.0)", type: string, required: true }
      repo: { description: "Only this repo (optional)", type: string, required: false }

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.AGENTBASE_APP_ID }}
          private-key: ${{ secrets.AGENTBASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - id: list
        env: { GH_TOKEN: "${{ steps.app.outputs.token }}" }
        run: |
          if [ -n "${{ inputs.repo }}" ]; then
            repos='["${{ inputs.repo }}"]'
          else
            repos=$(gh repo list "${{ github.repository_owner }}" --topic agentbase-consumer --limit 500 --json name -q '[.[].name]' -c)
          fi
          echo "repos=$repos" >> "$GITHUB_OUTPUT"
          echo "targets: $repos"

  rollout:
    needs: discover
    if: needs.discover.outputs.repos != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        repo: ${{ fromJson(needs.discover.outputs.repos) }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.AGENTBASE_APP_ID }}
          private-key: ${{ secrets.AGENTBASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }},agentbase
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Bump agentbase ref
        id: bump
        run: |
          old=$(grep -oE '"ref": *"[^"]+"' rulesync.jsonc | head -1 | sed -E 's/.*"([^"]+)"$/\1/')
          echo "old=$old" >> "$GITHUB_OUTPUT"
          sed -i -E '/\/agentbase"/ s/"ref": *"[^"]+"/"ref": "'"${{ inputs.ref }}"'"/' rulesync.jsonc
          grep -q "\"${{ inputs.ref }}\"" rulesync.jsonc || { echo "::error::ref not bumped in rulesync.jsonc"; exit 1; }
      - name: Install + generate
        env: { GITHUB_TOKEN: "${{ steps.app.outputs.token }}" }
        run: |
          npx rulesync@16 install --update
          npx rulesync@16 generate
      - name: Release notes for PR body
        id: notes
        env: { GH_TOKEN: "${{ steps.app.outputs.token }}" }
        run: |
          {
            echo "body<<EOF"
            echo "## Changelog"
            echo "- Bump agentbase \`${{ steps.bump.outputs.old }}\` → \`${{ inputs.ref }}\`"
            echo
            echo "## Description"
            echo "Automated rollout of shared AI agent config. Generated files are regenerated from the new lockfile; do not edit them by hand."
            echo
            gh release view "${{ inputs.ref }}" --repo "${{ github.repository }}" --json body -q .body || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app.outputs.token }}
          branch: chore/agentbase-sync
          delete-branch: true
          commit-message: "chore: bump agentbase to ${{ inputs.ref }}"
          title: "#0 - Bump agentbase to ${{ inputs.ref }}"
          body: ${{ steps.notes.outputs.body }}
          labels: agentbase
