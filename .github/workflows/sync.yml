# Opens (or updates) a PR in every repo tagged with the `agentbase-consumer` topic,
# bumping its agentbase ref and regenerating tool config.
name: sync consumers
on:
  workflow_call:
    inputs:
      ref: { type: string, required: true }
  workflow_dispatch:
    inputs:
      ref: { description: "agentbase tag to roll out (e.g. v1.4.0)", type: string, required: true }
      repo: { description: "Only this repo (optional)", type: string, required: false }

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.AGENTBASE_APP_ID }}
          private-key: ${{ secrets.AGENTBASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - id: list
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ inputs.repo }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$REPO" ]; then
            repos=$(jq -cn --arg r "$REPO" '[$r]')
          else
            repos=$(gh repo list "$OWNER" --topic agentbase-consumer --limit 500 --json name -q '[.[].name]')
          fi
          echo "repos=$repos" >> "$GITHUB_OUTPUT"
          echo "targets: $repos"

  rollout:
    needs: discover
    if: needs.discover.outputs.repos != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        repo: ${{ fromJson(needs.discover.outputs.repos) }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.AGENTBASE_APP_ID }}
          private-key: ${{ secrets.AGENTBASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }},agentbase
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Bump agentbase ref
        id: bump
        env: { REF: "${{ inputs.ref }}" }
        run: |
          [[ "$REF" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid ref: $REF"; exit 1; }
          # The topic is added when the adoption PR opens, so it can precede the merge that adds rulesync.jsonc.
          if [ ! -f rulesync.jsonc ]; then
            echo "::notice::${{ matrix.repo }} has no rulesync.jsonc on its default branch yet; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp rulesync.lock "$RUNNER_TEMP/old.lock" 2>/dev/null || true
          old=$(grep -oE '"ref": *"[^"]+"' rulesync.jsonc | head -1 | sed -E 's/.*"([^"]+)"$/\1/')
          echo "old=$old" >> "$GITHUB_OUTPUT"
          sed -i -E '/\/agentbase"/ s/"ref": *"[^"]+"/"ref": "'"$REF"'"/' rulesync.jsonc
          grep -q "\"$REF\"" rulesync.jsonc || { echo "::error::ref not bumped in rulesync.jsonc"; exit 1; }
      - name: Install + generate
        if: steps.bump.outputs.skip != 'true'
        env: { GITHUB_TOKEN: "${{ steps.app.outputs.token }}" }
        run: |
          npx rulesync@16 install --update
          npx rulesync@16 generate
      - name: Commit message and PR body
        id: msg
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REF: ${{ inputs.ref }}
          OLD: ${{ steps.bump.outputs.old }}
        run: |
          changed=$(node -e '
            const fs = require("fs");
            const read = (f) => { try { return JSON.parse(fs.readFileSync(f, "utf8")); } catch { return {}; } };
            const skills = (lock) => Object.fromEntries(Object.values(lock.sources ?? {})
              .flatMap((s) => Object.entries(s.skills ?? {}).map(([name, v]) => [name, v.integrity])));
            const before = skills(read(process.argv[1])), after = skills(read("rulesync.lock"));
            const names = [...new Set([...Object.keys(before), ...Object.keys(after)])].filter((n) => before[n] !== after[n]).sort();
            console.log(names.map((n) => !(n in before) ? `${n} (new)` : !(n in after) ? `${n} (removed)` : n).join(", ") || "none");
          ' "$RUNNER_TEMP/old.lock")
          # Consumers keep the agentbase-check.yml they were adopted with, so sync is where older ones hear about this.
          ignored=$(
            { find . \( -path ./.git -o -path ./.rulesync -o -path ./node_modules \) -prune -o -type f -path '*/skills/*/SKILL.md' -print
              [ -f .claude/settings.json ] && echo ./.claude/settings.json; } | git check-ignore -v --stdin | grep -Ev '^[^:]*:[0-9]+:!' | cut -f1 | sort -u | paste -sd' ' - || true
          )
          [ -z "$ignored" ] || echo "::warning::${{ matrix.repo }}: .gitignore hides generated files ($ignored); they are not committed."
          # Release notes are free text, so a fixed heredoc delimiter could end the output early.
          eof="EOF_$(openssl rand -hex 8)"
          {
            echo "title=chore(agentbase): update shared AI agent skills to $REF"
            echo "commit<<$eof"
            echo "chore(agentbase): update shared AI agent skills to $REF"
            echo
            echo "Bump $GITHUB_REPOSITORY from $OLD to $REF and regenerate."
            echo
            echo "Changed skills: $changed"
            echo "$eof"
            echo "body<<$eof"
            echo "## Changelog"
            echo "- Bump agentbase \`$OLD\` → \`$REF\`"
            echo "- Changed skills: $changed"
            echo
            echo "## Description"
            echo "Automated rollout of shared AI agent config. Generated files are regenerated from the new lockfile; do not edit them by hand."
            echo
            if [ -n "$ignored" ]; then
              echo "## Before merge"
              echo "- \`.gitignore\` hides generated files, so this PR cannot commit them: $ignored. Un-ignore them (e.g. replace \`.claude\` with \`.claude/*\`, \`!.claude/skills/\`, \`!.claude/settings.json\`)."
              echo
            fi
            gh release view "$REF" --repo "$GITHUB_REPOSITORY" --json body -q .body || true
            echo "$eof"
          } >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v7
        if: steps.bump.outputs.skip != 'true'
        with:
          token: ${{ steps.app.outputs.token }}
          branch: chore/agentbase-sync
          delete-branch: true
          commit-message: ${{ steps.msg.outputs.commit }}
          title: ${{ steps.msg.outputs.title }}
          body: ${{ steps.msg.outputs.body }}
          labels: agentbase
