# Reusable: rolls a content repo's release out. Called by release.yml, or by the content repo's own
# sync workflow to roll a tag out by hand. Opens (or updates) a PR in every repo of the content repo's
# owner tagged `agentspread-consumer`, copying its groups at that tag into .agentspread/ and regenerating.
name: sync consumers
on:
  workflow_call:
    inputs:
      ref: { description: "content repo tag to roll out (e.g. v1.4.0)", type: string, required: true }
      repo: { description: "Only this consumer repo (optional)", type: string, required: false, default: "" }
      force: { description: "Allow rolling a repo back to an older tag", type: boolean, required: false, default: false }
    secrets:
      AGENTSPREAD_APP_ID: { required: true }
      AGENTSPREAD_APP_PRIVATE_KEY: { required: true }

env:
  # A consumer's project .npmrc must not be able to swap the package that runs here.
  npm_config_registry: https://registry.npmjs.org/

jobs:
  discover:
    runs-on: ubuntu-latest
    # Restricting this environment to the release branch keeps the App key away from other branches.
    environment: release
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ secrets.AGENTSPREAD_APP_ID }}
          private-key: ${{ secrets.AGENTSPREAD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read
      - id: list
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ inputs.repo }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$REPO" ]; then
            repos=$(jq -cn --arg r "$REPO" '[$r]')
          else
            repos=$(gh repo list "$OWNER" --topic agentspread-consumer --no-archived --limit 1000 --json name -q '[.[].name]')
            [ "$(jq length <<<"$repos")" -lt 1000 ] || { echo "::error::1000+ consumers; paginate discovery"; exit 1; }
          fi
          echo "repos=$repos" >> "$GITHUB_OUTPUT"
          echo "targets: $repos"

  rollout:
    needs: discover
    if: needs.discover.outputs.repos != '[]'
    runs-on: ubuntu-latest
    environment: release
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        repo: ${{ fromJson(needs.discover.outputs.repos) }}
    # Two rollouts to one repo would race on chore/agentspread-sync; the later one waits instead.
    concurrency:
      group: agentspread-sync-${{ matrix.repo }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: consumer
    steps:
      - uses: actions/create-github-app-token@v3
        id: write
        with:
          app-id: ${{ secrets.AGENTSPREAD_APP_ID }}
          private-key: ${{ secrets.AGENTSPREAD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/create-github-app-token@v3
        id: read
        with:
          app-id: ${{ secrets.AGENTSPREAD_APP_ID }}
          private-key: ${{ secrets.AGENTSPREAD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          token: ${{ steps.write.outputs.token }}
          path: consumer
          persist-credentials: false
      # The content being rolled out.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          token: ${{ steps.read.outputs.token }}
          path: content
          persist-credentials: false
      # This workflow's own repo and commit, so the scripts always match the version the caller pinned.
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: engine
          persist-credentials: false
      - uses: actions/setup-node@v7
        # npx needs no install, and v5+ auto-caching fails when a packageManager field has no lockfile.
        with: { node-version: 22, package-manager-cache: false }
      - name: Copy the release into .agentspread/
        id: apply
        env:
          REF: ${{ inputs.ref }}
          REPO: ${{ matrix.repo }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          [[ "$REF" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid ref: $REF"; exit 1; }
          # The topic is added when the adoption PR opens, so it can precede the merge that adds rulesync.jsonc.
          if [ ! -f rulesync.jsonc ]; then
            echo "::notice::$REPO has no rulesync.jsonc on its default branch yet; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          old=$(node -e 'try { console.log(require("./agentspread.json").ref ?? "") } catch { console.log("") }')
          echo "old=${old:-none}" >> "$GITHUB_OUTPUT"
          node ../engine/scripts/sync-consumer.mjs apply "$REF" "$GITHUB_REPOSITORY" "$REPO" --from ../content $FORCE
      - name: Generate agent files
        if: steps.apply.outputs.skip != 'true'
        # No token here: generation reads only the checkout, so a compromised package has nothing to steal.
        run: |
          [ ! -f rulesync.lock ] || npx --yes rulesync@16 install --frozen
          npx --yes rulesync@16 generate --delete
      - name: Commit message and PR body
        id: msg
        if: steps.apply.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          REF: ${{ inputs.ref }}
          OLD: ${{ steps.apply.outputs.old }}
          REPO: ${{ matrix.repo }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::$REPO is already up to date with $REF; no PR."
            echo "open=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "open=true" >> "$GITHUB_OUTPUT"
          changed=$(node ../engine/scripts/sync-consumer.mjs summary)
          ignored=$(git ls-files --others --ignored --exclude-standard -- .agentspread .claude .agents .codex .github \
            .cursor .opencode .cline .roo .kiro .junie .warp .qwen .augment | grep -v '\.local\.' | paste -sd' ' - || true)
          [ -z "$ignored" ] || echo "::warning::$REPO: .gitignore hides generated files: $ignored"
          # Release notes are free text, so a fixed heredoc delimiter could end the output early.
          eof="EOF_$(openssl rand -hex 8)"
          {
            echo "title=chore(agentspread): update shared AI agent config to $REF"
            echo "commit<<$eof"
            echo "chore(agentspread): update shared AI agent config to $REF"
            echo
            echo "Copy $GITHUB_REPOSITORY $REF (was $OLD) into .agentspread/ and regenerate."
            echo
            echo "Changed: $changed"
            echo "$eof"
            echo "body<<$eof"
            echo "## Changelog"
            echo "- Bump \`$GITHUB_REPOSITORY\` \`$OLD\` → \`$REF\`"
            echo "- Changed: $changed"
            echo
            echo "## Description"
            echo "Automated rollout of shared AI agent config. \`.agentspread/\` and the generated agent files are rewritten on every sync; do not edit them by hand."
            echo
            if [ -n "$ignored" ]; then
              echo "## Before merge"
              echo "- \`.gitignore\` hides generated files, so this PR cannot commit them: $ignored. Fix \`.gitignore\` on the default branch (not on this branch, which sync rebuilds)."
              echo
            fi
            gh release view "$REF" --repo "$GITHUB_REPOSITORY" --json body -q .body || true
            echo "$eof"
          } >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v8
        if: steps.apply.outputs.skip != 'true' && steps.msg.outputs.open == 'true'
        with:
          path: consumer
          token: ${{ steps.write.outputs.token }}
          branch: chore/agentspread-sync
          delete-branch: true
          commit-message: ${{ steps.msg.outputs.commit }}
          title: ${{ steps.msg.outputs.title }}
          body: ${{ steps.msg.outputs.body }}
          labels: agentspread
