# Reusable: called by a content repo's own release workflow, e.g.
#   jobs: { release: { uses: sulhadin/agentspread/.github/workflows/release.yml@v1.0.0, secrets: inherit } }
# Picks the version from the content repo's conventional commits, updates its CHANGELOG.md, tags,
# publishes the GitHub release and rolls it out to every consumer (sync.yml).
name: release
on:
  workflow_call:
    outputs:
      tag:
        value: ${{ jobs.release.outputs.tag }}
    secrets:
      AGENTSPREAD_APP_ID: { required: true }
      AGENTSPREAD_APP_PRIVATE_KEY: { required: true }
jobs:
  release:
    runs-on: ubuntu-latest
    # The caller's environment: restricting it to the release branch keeps the App key away from others.
    environment: release
    concurrency: agentspread-release
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    env:
      RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH || 'main' }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      # semantic-release silently skips other branches, which would read as "nothing to release".
      - name: Only from the release branch
        if: github.ref_name != env.RELEASE_BRANCH
        run: |
          echo "::error::Run this workflow from '$RELEASE_BRANCH', not '$REF_NAME'."
          exit 1
      # The App token (not GITHUB_TOKEN) lets the release commit through the branch's protection.
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ secrets.AGENTSPREAD_APP_ID }}
          private-key: ${{ secrets.AGENTSPREAD_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v7
        with:
          path: content
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      # This workflow's own repo and commit, so the scripts always match the version the caller pinned.
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: engine
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: engine/package-lock.json }
      - run: npm ci
        working-directory: engine
      - id: release
        working-directory: content
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GIT_AUTHOR_NAME: agentspread-release
          GIT_AUTHOR_EMAIL: agentspread-release@users.noreply.github.com
          GIT_COMMITTER_NAME: agentspread-release
          GIT_COMMITTER_EMAIL: agentspread-release@users.noreply.github.com
        run: |
          ../engine/node_modules/.bin/semantic-release --extends ../engine/release.content.cjs
          grep -q '^tag=' "$GITHUB_OUTPUT" || echo "::notice::No feat/fix/breaking commits since the last tag — nothing to release."
  sync:
    needs: release
    # always(): a release that pushed its tag but then failed (e.g. creating the GitHub release) still rolls out.
    if: always() && needs.release.outputs.tag != ''
    uses: ./.github/workflows/sync.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
    secrets: inherit
