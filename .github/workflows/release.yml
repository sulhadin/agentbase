name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's CHANGELOG section
        id: notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p=($2==v || $2=="["v"]")} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "No CHANGELOG entry for $v." > notes.md
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env: { GH_TOKEN: "${{ github.token }}" }
  sync:
    needs: release
    uses: ./.github/workflows/sync.yml
    with:
      ref: ${{ github.ref_name }}
    secrets: inherit
