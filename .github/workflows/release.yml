# Reusable: called by a content repo's own release workflow, e.g.
#   jobs: { release: { uses: sulhadin/agentspread/.github/workflows/release.yml@v1.0.0, secrets: inherit } }
# Picks the version from the content repo's conventional commits, updates its CHANGELOG.md, tags,
# publishes the GitHub release and, with App delivery, rolls it out to every consumer (sync.yml).
# With keyless delivery ("agentspread": { "delivery": "pull" } in the content repo's package.json) it
# needs no secrets and pushes with the caller's GITHUB_TOKEN; consumers pull the release themselves.
name: release
on:
  workflow_call:
    outputs:
      tag:
        value: ${{ jobs.release.outputs.tag }}
    secrets:
      AGENTSPREAD_APP_ID: { required: false }
      AGENTSPREAD_APP_PRIVATE_KEY: { required: false }
jobs:
  release:
    runs-on: ubuntu-latest
    # The caller's environment: restricting it to the release branch keeps the App key away from others.
    environment: release
    concurrency: agentspread-release
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      delivery: ${{ steps.delivery.outputs.delivery }}
    env:
      RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH || 'main' }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      # semantic-release silently skips other branches, which would read as "nothing to release".
      - name: Only from the release branch
        if: github.ref_name != env.RELEASE_BRANCH
        run: |
          echo "::error::Run this workflow from '$RELEASE_BRANCH', not '$REF_NAME'."
          exit 1
      - name: Read the delivery mode
        id: delivery
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_APP: ${{ secrets.AGENTSPREAD_APP_ID != '' && secrets.AGENTSPREAD_APP_PRIVATE_KEY != '' }}
        run: |
          # A content repo without package.json predates delivery modes, so it gets App delivery.
          content=$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$GITHUB_SHA" -q .content 2>/dev/null || true)
          delivery=$(printf '%s' "$content" | { base64 -d 2>/dev/null || true; } | jq -r '.agentspread.delivery // empty' 2>/dev/null || true)
          delivery=${delivery:-app}
          case "$delivery" in
            app) [ "$HAS_APP" = true ] || { echo "::error::App delivery needs the AGENTSPREAD_APP_ID and AGENTSPREAD_APP_PRIVATE_KEY secrets in the release environment. For delivery without a key, set \"agentspread\": { \"delivery\": \"pull\" } in package.json."; exit 1; } ;;
            pull) ;;
            *) echo "::error::package.json has an unknown agentspread.delivery: $delivery (use app or pull)"; exit 1 ;;
          esac
          echo "delivery=$delivery" >> "$GITHUB_OUTPUT"
      # The App token (not GITHUB_TOKEN) lets the release commit through the branch's protection.
      - uses: actions/create-github-app-token@v3
        if: steps.delivery.outputs.delivery == 'app'
        id: app
        with:
          app-id: ${{ secrets.AGENTSPREAD_APP_ID }}
          private-key: ${{ secrets.AGENTSPREAD_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v7
        with:
          path: content
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      # This workflow's own repo and commit, so the scripts always match the version the caller pinned.
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: engine
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: engine/package-lock.json }
      - run: npm ci
        working-directory: engine
      - id: release
        working-directory: content
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GIT_AUTHOR_NAME: agentspread-release
          GIT_AUTHOR_EMAIL: agentspread-release@users.noreply.github.com
          GIT_COMMITTER_NAME: agentspread-release
          GIT_COMMITTER_EMAIL: agentspread-release@users.noreply.github.com
          DELIVERY: ${{ steps.delivery.outputs.delivery }}
        run: |
          ../engine/node_modules/.bin/semantic-release --extends ../engine/release.content.cjs || {
            # Keyless delivery pushes with GITHUB_TOKEN, which is read-only unless the caller grants more.
            [ "$DELIVERY" != pull ] || echo "::error::With keyless delivery the release pushes with GITHUB_TOKEN. Add 'permissions: { contents: write }' to .github/workflows/agentspread-release.yml, and let GitHub Actions push to the release branch."
            exit 1
          }
          grep -q '^tag=' "$GITHUB_OUTPUT" || echo "::notice::No feat/fix/perf/breaking commits since the last tag — nothing to release."
  sync:
    needs: release
    # always(): a release that pushed its tag but then failed (e.g. creating the GitHub release) still rolls out.
    if: always() && needs.release.outputs.tag != '' && needs.release.outputs.delivery == 'app'
    uses: ./.github/workflows/sync.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
    secrets: inherit
