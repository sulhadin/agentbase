# Run by hand from the release branch: main, or the repo variable RELEASE_BRANCH when set.
# Picks the version from conventional commits since the last tag, updates CHANGELOG.md, tags,
# publishes the GitHub release and rolls it out to consumers.
name: release
on:
  workflow_dispatch:
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    # Restricting this environment to the release branch keeps the App key away from other branches.
    environment: release
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    env:
      RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH || 'main' }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      # semantic-release silently skips other branches, which would read as "nothing to release".
      - name: Only from the release branch
        if: github.ref_name != env.RELEASE_BRANCH
        run: |
          echo "::error::Run this workflow from '$RELEASE_BRANCH', not '$REF_NAME'."
          exit 1
      # The App token (not GITHUB_TOKEN) lets the release commit through the branch's protection.
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ secrets.AGENTBASE_APP_ID }}
          private-key: ${{ secrets.AGENTBASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - id: release
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GIT_AUTHOR_NAME: agentbase-release
          GIT_AUTHOR_EMAIL: agentbase-release@users.noreply.github.com
          GIT_COMMITTER_NAME: agentbase-release
          GIT_COMMITTER_EMAIL: agentbase-release@users.noreply.github.com
        run: |
          npx semantic-release
          grep -q '^tag=' "$GITHUB_OUTPUT" || echo "::notice::No feat/fix/breaking commits since the last tag — nothing to release."
  sync:
    needs: release
    # always(): a release that pushed its tag but then failed (e.g. creating the GitHub release) still rolls out.
    if: always() && needs.release.outputs.tag != ''
    uses: ./.github/workflows/sync.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
    secrets: inherit
