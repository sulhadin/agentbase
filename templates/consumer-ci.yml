# Copy to .github/workflows/agentbase-check.yml in the consumer repo.
name: agentbase check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        # Runs in a consumer checkout: npx needs no install, and v5+ auto-caching fails when a packageManager field has no lockfile.
        with: { node-version: 22, package-manager-cache: false }
      - name: Regenerate from lockfile and fail on drift
        env:
          GITHUB_TOKEN: ${{ secrets.AGENTBASE_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          npx rulesync@16 install --frozen
          npx rulesync@16 generate
          git diff --exit-code || {
            echo "::error::Generated AI config is out of date or was hand-edited. Run: npx rulesync install --frozen && npx rulesync generate"
            exit 1
          }
      # An ignored generated file never shows up in the diff above, so drift there would pass silently.
      - name: Fail if .gitignore hides generated files
        run: |
          ignored=$(
            { find . \( -path ./.git -o -path ./.rulesync -o -path ./node_modules \) -prune -o -type f -path '*/skills/*/SKILL.md' -print
              [ -f .claude/settings.json ] && echo ./.claude/settings.json; } | git check-ignore -v --stdin | grep -Ev '^[^:]*:[0-9]+:!' || true
          )
          [ -z "$ignored" ] || {
            echo "::error::.gitignore hides generated files, so they are never committed: $(echo "$ignored" | cut -f1 | sort -u | paste -sd' ' -)"
            exit 1
          }
